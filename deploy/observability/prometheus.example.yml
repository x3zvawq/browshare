# Single Linux host example. Replace targets with private monitoring addresses
# when services run on different hosts; these ports are not public ingress.
global:
  scrape_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  - job_name: browshare-backend
    static_configs:
      - targets: ['127.0.0.1:3400']
  - job_name: browshare-worker
    static_configs:
      - targets: ['127.0.0.1:3410']
  - job_name: browshare-gateway
    authorization:
      type: Bearer
      credentials_file: /run/secrets/gateway-secret
    static_configs:
      - targets: ['127.0.0.1:3482']
