services:
  browshare-worker:
    image: ${BROWSHARE_WORKER_IMAGE:?set BROWSHARE_WORKER_IMAGE to a pinned digest}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /run:rw,noexec,nosuid,size=16m
      - /home/node:rw,noexec,nosuid,uid=1000,gid=1000,mode=0700,size=64m
    security_opt:
      - no-new-privileges:true
      - seccomp=./chrome-seccomp.json
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    cpus: ${BROWSHARE_WORKER_CPUS:-4.0}
    mem_limit: ${BROWSHARE_WORKER_MEMORY:-4g}
    pids_limit: ${BROWSHARE_WORKER_PIDS:-1024}
    shm_size: 1gb
    stop_grace_period: 30s
    env_file:
      - ${BROWSHARE_WORKER_ENV_FILE:?set BROWSHARE_WORKER_ENV_FILE to a 0600 env file}
    volumes:
      - type: bind
        source: ${BROWSHARE_WORKER_IDENTITY_VOLUME:?set identity volume directory}
        target: /var/lib/browshare/identity
      - type: bind
        source: ${BROWSHARE_WORKER_PROFILE_VOLUME:?set profile volume directory}
        target: /var/lib/browshare/profiles
      - type: bind
        source: ${BROWSHARE_WORKER_SESSION_TEMP_VOLUME:?set session temp volume directory}
        target: /var/lib/browshare/session-temp
      - type: bind
        source: ${BROWSHARE_WORKER_POLICY_VOLUME:?set policy volume directory}
        target: /var/lib/browshare/chrome-policy
      - type: bind
        source: ${BROWSHARE_WORKER_EXTENSION_VOLUME:?set extension release directory}
        target: /opt/browshare/extension-release
        read_only: true
    healthcheck:
      test: [CMD, node, healthcheck.mjs, worker]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
